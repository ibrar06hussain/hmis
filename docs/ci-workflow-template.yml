name: HMIS CI (Laravel 13 + PHP 8.4 Multi-DB Matrix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Pint Style & Local Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code formatting (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Install npm dependencies & build local offline assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, openssl, pdo_sqlite, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build Vite manifest
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Suite (SQLite)
        run: php artisan test

  test-postgres:
    name: Tests (PostgreSQL 17 — Canonical Production DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chg_hmis_test
          POSTGRES_USER: hmis_test
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, openssl, pdo_pgsql, pgsql, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build Vite manifest
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Suite against PostgreSQL 17
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: chg_hmis_test
          DB_USERNAME: hmis_test
          DB_PASSWORD: secret_test_password
        run: php artisan test

  test-mysql:
    name: Tests (MySQL 8.0 — Hostinger Demo Compatibility)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chg_hmis_test
          MYSQL_ROOT_PASSWORD: secret_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, openssl, pdo_mysql, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build Vite manifest
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Suite against MySQL 8.0
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chg_hmis_test
          DB_USERNAME: root
          DB_PASSWORD: secret_test_password
        run: php artisan test
